<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Local two-player Tic-Tac-Toe battle">
  <title>Local Battle - Tic Tac Toe</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Local Battle</h1>
    <h2>👥 Two Player Mode</h2>

    <!-- Game Board -->
    <div id="game-board" class="game-board"></div>

    <!-- Turn Indicator -->
    <p id="turn-indicator" class="turn-indicator">⚔️ X's Turn</p>

    <!-- Buttons -->
    <div style="margin-top: 20px;">
      <button id="reset-btn" class="btn">🔄 Reset Game</button>
      <a href="/" class="btn back-btn">🏠 Back to Menu</a>
    </div>
  </div>

  <footer class="footer">
    <p class="footer-text">
      Crafted with <span class="heart">❤️</span> by <strong>Anurag Vinod Tiwari</strong>
    </p>
  </footer>

  <script src="/js/game/OfflineGame.js"></script>
</body>
</html>
